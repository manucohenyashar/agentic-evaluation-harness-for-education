# Configuration for the first live teacher test: the "dev-ci" profile, grading through OpenRouter.
#
# This is a SMOKE profile: one judge, which proves the whole path works end to end but cannot
# show agreement (with one judge nobody can disagree, and the random extra-grader sample stays
# off). For a test that should say how far the system's marks agree with the teacher's, use
# live-test.panel.toml in this folder: three judges from three model families, three escalation
# judges and the random sample on.
#
# Why dev-ci and not cloud-hosted: the console refuses to start under cloud-hosted (it has no
# login, so it may only run on one machine, for one person). "dev-ci" also sends student work
# to OpenRouter, so it is gated by the same consent rule: only cohorts marked "synthetic" or
# "consented" may be graded (the sample answer sheets are synthetic).
#
# Every request to OpenRouter carries zdr=true and data_collection="deny": OpenRouter sends the
# work only to a host that keeps no copy, or refuses it and the run pauses. Set
# HARNESS_FIXTURE_DIR and dev-ci replays recordings from that folder instead (the test tier);
# leave it unset for a real run. `aeh run` prints a "provider:" line saying which one answers.
#
# Use it with the checker before anything else:
#     python docs/live-tests/sample-materials/check_config.py docs/live-tests/config/live-test.dev-ci.toml
#
# The secret is NEVER written in this file. Put it in your terminal session instead:
#     export OPENROUTER_API_KEY="sk-or-..."          (macOS / Linux)
#     $env:OPENROUTER_API_KEY = "sk-or-..."          (Windows PowerShell)
#
# STATUS: both model names below answered real calls on 2026-10-03, through zero-retention hosts
# (qwen3-30b-a3b via DeepInfra, qwen3-vl-8b-instruct via Parasail). If you change them, confirm
# the new ones on https://openrouter.ai/models first. The date after "@" is the version you are
# pinning; the system refuses names ending in :latest, @latest, @stable, @main, @head or @newest.

# Which profile this file selects when HARNESS_PROFILE is not set in the terminal. (The terminal
# wins if both are set.) Set here so that `aeh console` and `aeh run` work without extra typing.
HARNESS_PROFILE = "dev-ci"

prompt_template_v = "judge-prompt/4"

[profiles.dev-ci]
# Spending limit for the whole run, in the currency below. The run stops dispatching when it is
# reached. 5 is plenty for the ten sample answer sheets.
HARNESS_COST_CEILING = 5
HARNESS_COST_CURRENCY = "USD"

# A small class: every disagreement may get more judges (the 0.30 default stops a few-paper run).
orch_escalation_budget = 1.0
# A one-judge panel: no random extra-grader sample (it needs two escalation judges, see below).
orch_random_arm_rate = 0

# The Jev decision engine is ON by default on this profile (FR-CONF-29): every rubric cell is
# pre-screened by the Jev decision model, which either settles the band itself or hands the cell
# back to the judge panel — both outcomes are recorded in run_metrics. The engine uses
# OpenRouter's alias typesafe/jev-latest (owner decision 2026-11-20; typesafe/jev-1.13 is no
# longer listed). On 2026-11-20 the alias serves typesafe/jev-1.14, so a run's recorded
# resolved_build is expected to read jev-1.14-<date>. Two runs may be graded by different Jev
# versions. While one process drives a run it stays on one: the first answer fixes the build
# and any later answer from another stops it (BuildWatch). A run paused and resumed in a new
# process may continue on a newer build; both then show in the run's recorded builds. The date
# after "@" records the day the alias
# was chosen; it does not freeze the version. Jev is exempt from the zero-retention check (owner
# decision 2026-11-20): the run records it under retention_exempt, not as confirmed. The
# judges and the page reader are still checked.
HARNESS_JEV_BUILD = "openrouter/typesafe/jev-latest@2026-11-20"

# For a one-off run with the engine off (every score then has one clear source, the judge
# panel), set it in the terminal instead of here — the terminal wins, and the file keeps the
# engine the acceptance runs:
#     export HARNESS_DECISION_ENGINE=off           (macOS / Linux)
#     $env:HARNESS_DECISION_ENGINE = "off"         (Windows PowerShell)

# The model that reads the page images and turns them into text.
[profiles.dev-ci.transcriber]
role = "transcriber"
provider = "openrouter"
build_id = "openrouter/openai/gpt-6-luna@2026-06-01"

# The judge panel. The size must be 1, 3 or 5 (never 2 or 4: an even panel cannot break a tie).
# One judge is the smallest working test, but with one judge the system has nobody to disagree
# with, so it cannot show agreement figures. For a real accuracy test use live-test.panel.toml,
# which ships three confirmed judges from different model families and three escalation judges.
# To grow this file instead, uncomment the two extra blocks and replace the names with models you
# have confirmed on openrouter.ai/models (they are placeholders, not recommendations).
[[profiles.dev-ci.panel]]
role = "judge"
provider = "openrouter"
build_id = "openrouter/openai/gpt-6-luna@2026-06-01"

# [[profiles.dev-ci.panel]]
# role = "judge"
# provider = "openrouter"
# build_id = "openrouter/<vendor>/<second-model>@<date>"
#
# [[profiles.dev-ci.panel]]
# role = "judge"
# provider = "openrouter"
# build_id = "openrouter/<vendor>/<third-model>@<date>"

# Escalation judges: the real models used when the system adds judges to an answer (two when
# the judges are unsure or disagree, one more if a judge call is lost). Each must be a different
# model from the panel and from each other, pinned with a date, and answer under zero retention
# (check it first; see the deployment tutorial 7.6). Without them, such answers keep their score
# as provisional and go to teacher review, and orch_random_arm_rate (above) must stay 0.
# For a one-judge panel: two let the random sample stay on; five cover every seat a run can
# ever need (a sampled answer has three judges, can widen to five, plus one replacement).
# Placeholders, not recommendations:
# [[profiles.dev-ci.escalation_judge]]
# role = "judge"
# provider = "openrouter"
# build_id = "openrouter/<vendor>/<model-a>@<date>"
