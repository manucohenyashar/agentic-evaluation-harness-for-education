# FR-STORE-15: `pip install .` provides the pipeline without the dev requirements. setuptools
# is the build backend because the project is a plain src-layout package with no extension
# modules and no build step of its own — the console's stylesheet is package DATA, not an
# artifact something compiles (TC-CONSOLE-34 asserts the repository carries no toolchain).
#
# Note for an air-gapped install: pip's default build isolation FETCHES setuptools, so a
# machine with no network needs `pip install . --no-build-isolation` with setuptools already
# present. The RUNTIME is stdlib-only either way; it is the build step that wants a backend.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-evaluation-harness-for-education"
version = "0.0.0"
description = "Agentic Evaluation Harness for Education"
requires-python = ">=3.11"

# ADR-11: Python 3.11+, stdlib sqlite3. Runtime dependencies land with the modules that
# need them; nothing is required to run the fast tier by design (NFR-SYS-06, test plan §4.5 E1).
dependencies = []

# ADR-11, stated as packaging: the core is stdlib-only, so a core install can never pull a
# transitive dependency into the machine that grades student work. The PDF readers the LIVE
# ingest leg needs are an extra, and the fast tier does not install it — which is what keeps
# "no network, no toolchain" a property of the install rather than of anyone's discipline.
[project.optional-dependencies]
live-ingest = ["pypdf>=6.0", "pypdfium2>=4.0"]

# The installed command. `aeh.pipeline:main` lands with the M-PIPE composition story; the
# entry point is declared ahead of it deliberately (the install succeeds and the name exists;
# invoking it says the CLI has not landed). `python -m aeh` is the same call through
# `aeh/__main__.py`, so the two spellings cannot drift.
[project.scripts]
aeh = "aeh.pipeline:main"

[tool.setuptools]
# The console's stylesheet ships inside the package: a console installed on a machine with no
# toolchain and no network must render styled (RISK-58), and `GET /assets/console.css` serves
# this file from the installed package rather than from a checkout.
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["aeh*"]

[tool.setuptools.package-data]
aeh = ["console_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# `src` holds the implementation package (`aeh.*`); `.` holds the `harness.*` tooling
# package that test-plan §4.7 reserves for blast_radius / conform / mvvp entry points.
pythonpath = ["src", "."]

# --strict-markers turns a typo'd marker into an error rather than a silently unselected
# test, which matters because the marker IS the tier selector in §4.7's command table.
addopts = "--strict-markers"

# Markers, from test-plan §4.7's suite table. Every one names a tier that has its own
# command, its own CI trigger and its own duration budget.
markers = [
    "integration: real modules, real SQLite, fixture provider (§4.7, < 8 min)",
    "live: makes real model calls; nightly only, E2/E3 (§4.7, < 60 min)",
    "slow: excluded from the fast tier; TC-ORCH-09 is the only sanctioned sleep (§4.6)",
    "browser: headless browser, E6; three console cases only (§4.5)",
    "property: hypothesis property tests, --hypothesis-profile=ci (§4.7)",
    "fuzz: nightly fuzz campaign, --hypothesis-profile=nightly (§4.7)",
    "e2e: the three end-to-end journeys against the fixture provider (§6.2)",
    "contract: the CT-* clause suites of §6.11 (§4.10, < 60 s)",
    "writtenahead: written ahead of its implementation and expected to FAIL. Excluded from TEST_CMD. Remove this marker — never the test — when the implementing issue closes (test plan §8.2)",
]
